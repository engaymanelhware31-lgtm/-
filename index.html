<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محاسبه</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f6f9;color:#172033}
header{background:#132238;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:26px}.badge{font-size:13px;opacity:.85}
.container{max-width:1100px;margin:25px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:white;border-radius:12px;padding:22px;box-shadow:0 3px 12px #00000012}
.card h2{font-size:18px;margin:0 0 10px}.num{font-size:28px;font-weight:bold}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
button{border:0;border-radius:8px;padding:11px 16px;cursor:pointer;background:#132238;color:white;font-size:14px}
button.secondary{background:#e8edf3;color:#172033}
section{display:none}.active{display:block}
input,select,textarea{width:100%;padding:11px;border:1px solid #d5dbe3;border-radius:8px;margin:7px 0 14px;font-family:inherit}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
table{width:100%;border-collapse:collapse;background:white}th,td{padding:12px;border-bottom:1px solid #eee;text-align:right}
.empty{padding:30px;text-align:center;color:#777}
.notice{background:#fff8df;padding:12px;border-radius:8px;margin-bottom:16px}
#login{position:fixed;inset:0;background:#f4f6f9;display:flex;align-items:center;justify-content:center;z-index:10}
.loginbox{width:min(420px,92%);background:white;padding:30px;border-radius:14px;box-shadow:0 5px 25px #0002}.loginbox h1{text-align:center;margin-top:0}
.printbtn{background:#555;margin-top:8px}
@media print{header,nav,.no-print{display:none!important}section{display:none!important}.print-area{display:block!important}.container{margin:0;max-width:none}}
</style>
</head>
<body>
<div id="login">
<div class="loginbox">
<h1>محاسبه</h1>
<label>اسم المستخدم</label><input id="loginUser">
<label>كلمة المرور</label><input id="loginPass" type="password">
<button onclick="login()" style="width:100%">دخول</button>
</div>
</div>
<header><h1>محاسبه</h1><span class="badge">يعمل محليًا بدون إنترنت أو سيرفر</span></header>
<div class="container">
<nav>
<button onclick="show('home')">الرئيسية</button>
<button onclick="show('customers')">العملاء</button>
<button onclick="show('receipt')">سند قبض</button>
<button onclick="show('payment')">سند صرف</button>
<button onclick="show('employees')">الموظفين</button>
<button onclick="show('company')">تفاصيل الشركة</button>
<button onclick="show('salaries')">الرواتب</button>
</nav>

<section id="home" class="active">
<div class="card" style="margin-bottom:16px;text-align:center"><h2 id="homeCompanyName">اسم الشركة</h2></div>
<div class="notice">هذه النسخة تعمل مباشرة من الجهاز، والبيانات تُحفظ محليًا داخل المتصفح.</div>
<div class="grid">
<div class="card"><h2>العملاء</h2><div class="num" id="cCount">0</div></div>
<div class="card"><h2>الموظفين</h2><div class="num" id="eCount">0</div></div>
<div class="card"><h2>إجمالي سندات القبض</h2><div class="num" id="rTotal">0.00</div></div>
<div class="card"><h2>إجمالي سندات الصرف</h2><div class="num" id="pTotal">0.00</div></div>
</div>
</section>

<section id="customers">
<div class="card"><h2>بيانات العميل</h2>
<div class="formgrid">
<div><label>رقم العميل</label><input id="custNo" readonly placeholder="يتم توليده آليًا"></div>
<div><label>اسم العميل</label><input id="custName"></div>
<div><label>رقم الهاتف</label><input id="custPhone"></div>
<div><label>اسم المشروع</label><input id="custProject"></div>
<div><label>عنوان المشروع</label><input id="custAddress"></div>
<div><label>قيمة المشروع</label><input type="number" step="0.01" id="custValue"></div>
</div>
<button onclick="addCustomer()">حفظ العميل</button>
</div>
<div class="card" style="margin-top:16px"><h2>العملاء</h2><div id="customersTable"></div></div>
</section>

<section id="receipt">
<div class="card"><h2>سند قبض</h2>
<div class="formgrid"><div><label>التاريخ</label><input type="date" id="rDate"></div><div><label>العميل</label><select id="rCustomer"></select></div><div><label>المبلغ</label><input type="number" step="0.01" id="rAmount"></div><div><label>طريقة الدفع</label><select id="rMethod"><option>نقدي</option><option>تحويل</option><option>شيك</option></select></div></div>
<label>البيان</label><textarea id="rNote"></textarea><button onclick="addReceipt()">حفظ سند القبض</button><button class="printbtn" onclick="printReceipts()">طباعة سند القبض</button>
</div><div class="card" style="margin-top:16px"><div id="receiptsTable"></div></div>
</section>

<section id="payment">
<div class="card"><h2>سند صرف</h2>
<div class="formgrid"><div><label>التاريخ</label><input type="date" id="pDate"></div><div><label>المستفيد</label><input id="pBeneficiary"></div><div><label>المبلغ</label><input type="number" step="0.01" id="pAmount"></div><div><label>طريقة الدفع</label><select id="pMethod"><option>نقدي</option><option>تحويل</option><option>شيك</option></select></div></div>
<label>البيان</label><textarea id="pNote"></textarea><button onclick="addPayment()">حفظ سند الصرف</button><button class="printbtn" onclick="printPayments()">طباعة سند الصرف</button>
</div><div class="card" style="margin-top:16px"><div id="paymentsTable"></div></div>
</section>

<section id="employees">
<div class="card"><h2>إضافة موظف</h2>
<div class="formgrid"><div><label>اسم الموظف</label><input id="empName"></div><div><label>الرقم الوظيفي</label><input id="empNo"></div><div><label>الوظيفة</label><input id="empJob"></div><div><label>الراتب الأساسي</label><input type="number" step="0.01" id="empSalary"></div></div>
<button onclick="addEmployee()">حفظ الموظف</button>
</div><div class="card" style="margin-top:16px"><div id="employeesTable"></div></div>
</section>

<section id="company">
<div class="card"><h2>تفاصيل الشركة</h2>
<div class="formgrid">
<div><label>اسم الشركة</label><input id="companyName"></div>
</div>
<button onclick="saveCompany()">حفظ بيانات الشركة</button>
</div>
</section>
<section id="salaries">
<div class="card"><h2>الرواتب</h2>
<div class="formgrid"><div><label>الموظف</label><select id="sEmp"></select></div><div><label>الشهر</label><input type="month" id="sMonth"></div><div><label>البدلات</label><input type="number" step="0.01" id="sAllow"></div><div><label>الخصومات</label><input type="number" step="0.01" id="sDeduct"></div></div>
<button onclick="addSalary()">حفظ الراتب</button><button class="printbtn" onclick="printSalaries()">طباعة كشف الرواتب</button>
</div><div class="card" style="margin-top:16px"><div id="salariesTable"></div></div>
</section>
</div>
<script>
const key='mahaseba_v1';
let db=JSON.parse(localStorage.getItem(key)||'{"customers":[],"receipts":[],"payments":[],"employees":[],"salaries":[],"companyName":""}');
function save(){localStorage.setItem(key,JSON.stringify(db));render();}
function show(id){document.querySelectorAll('section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');render();}
function val(id){return document.getElementById(id).value.trim()}
function money(n){return Number(n||0).toFixed(2)}
function nextCustomerNo(){return db.customers.length?Math.max(...db.customers.map(x=>Number(x.no)||0))+1:1}
function addCustomer(){
if(!val('custName'))return alert('أدخل اسم العميل');
let no=nextCustomerNo();
db.customers.push({id:Date.now(),no,name:val('custName'),phone:val('custPhone'),project:val('custProject'),address:val('custAddress'),value:+val('custValue')||0});
['custName','custPhone','custProject','custAddress','custValue'].forEach(id=>document.getElementById(id).value='');
save()
}
function addReceipt(){let a=+val('rAmount');if(!a)return alert('أدخل المبلغ');db.receipts.push({no:db.receipts.length+1,date:val('rDate'),customer:document.getElementById('rCustomer').selectedOptions[0]?.text||'',amount:a,method:val('rMethod'),note:val('rNote')});save()}
function addPayment(){let a=+val('pAmount');if(!val('pBeneficiary')||!a)return alert('أدخل المستفيد والمبلغ');db.payments.push({no:db.payments.length+1,date:val('pDate'),beneficiary:val('pBeneficiary'),amount:a,method:val('pMethod'),note:val('pNote')});save()}
function addEmployee(){if(!val('empName'))return alert('أدخل اسم الموظف');db.employees.push({id:Date.now(),name:val('empName'),no:val('empNo'),job:val('empJob'),salary:+val('empSalary')||0});save()}
function addSalary(){let e=document.getElementById('sEmp').selectedOptions[0];if(!e)return;let emp=db.employees.find(x=>x.id==e.value),allow=+val('sAllow')||0,deduct=+val('sDeduct')||0;db.salaries.push({employee:emp.name,month:val('sMonth'),basic:emp.salary,allow,deduct,net:emp.salary+allow-deduct});save()}
function login(){
if(val('loginUser')==='admin' && document.getElementById('loginPass').value==='1234'){
document.getElementById('login').style.display='none';
}else alert('اسم المستخدم أو كلمة المرور غير صحيحة');
}
function saveCompany(){db.companyName=val('companyName');save();alert('تم حفظ بيانات الشركة')}
function printDoc(title,html){
let w=window.open('','_blank');
w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>${title}</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f7;font-family:Tahoma,Arial,sans-serif;color:#172033}
.sheet{width:210mm;min-height:297mm;margin:20px auto;background:#fff;padding:18mm;box-shadow:0 2px 12px #0002}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #132238;padding-bottom:16px;margin-bottom:24px}
.company{font-size:22px;font-weight:700;color:#132238}.type{text-align:left;font-size:26px;font-weight:700;color:#132238}
.meta{display:flex;justify-content:space-between;background:#f6f7f9;border:1px solid #e1e5ea;border-radius:8px;padding:12px 16px;margin-bottom:22px}
table{width:100%;border-collapse:collapse;margin-top:12px}th{background:#132238;color:#fff;padding:13px;text-align:right}td{border:1px solid #dfe3e8;padding:13px}
.amount{font-size:22px;font-weight:700}.notes{min-height:80px}.sign{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:80px;text-align:center}.sign div{border-top:1px solid #777;padding-top:10px}
.footer{margin-top:40px;padding-top:10px;border-top:1px solid #ddd;text-align:center;font-size:11px;color:#777}
@media print{body{background:#fff}.sheet{margin:0;box-shadow:none;width:auto;min-height:auto}button{display:none}}
</style></head><body><div class="sheet">${html}</div></body></html>`);
w.document.close();w.focus();setTimeout(()=>w.print(),300);
}
function documentHeader(type,no){
return `<div class="top"><div class="company">${db.companyName||'اسم الشركة'}</div><div class="type">${type}</div></div>
<div class="meta"><span><b>رقم السند:</b> ${no}</span><span><b>التاريخ:</b> ${new Date().toLocaleDateString('ar-KW')}</span></div>`;
}
function printReceipts(){
let x=db.receipts[db.receipts.length-1];if(!x)return alert('لا يوجد سند قبض');
printDoc('سند قبض',documentHeader('سند قبض',x.no)+
`<table><tr><th>البيان</th><th>التفاصيل</th></tr>
<tr><td>العميل</td><td>${x.customer}</td></tr>
<tr><td>المبلغ</td><td class="amount">${money(x.amount)}</td></tr>
<tr><td>طريقة الدفع</td><td>${x.method}</td></tr>
<tr><td>البيان</td><td class="notes">${x.note||''}</td></tr></table>
<div class="sign"><div>المستلم</div><div>المحاسب</div></div><div class="footer">تم إصدار هذا السند بواسطة برنامج محاسبه</div>`);
}
function printPayments(){
let x=db.payments[db.payments.length-1];if(!x)return alert('لا يوجد سند صرف');
printDoc('سند صرف',documentHeader('سند صرف',x.no)+
`<table><tr><th>البيان</th><th>التفاصيل</th></tr>
<tr><td>المستفيد</td><td>${x.beneficiary}</td></tr>
<tr><td>المبلغ</td><td class="amount">${money(x.amount)}</td></tr>
<tr><td>طريقة الدفع</td><td>${x.method}</td></tr>
<tr><td>البيان</td><td class="notes">${x.note||''}</td></tr></table>
<div class="sign"><div>المستفيد</div><div>المحاسب</div></div><div class="footer">تم إصدار هذا السند بواسطة برنامج محاسبه</div>`);
}
function printSalaries(){
if(!db.salaries.length)return alert('لا توجد رواتب');
let rows=db.salaries.map(x=>`<tr><td>${x.employee}</td><td>${x.month}</td><td>${money(x.basic)}</td><td>${money(x.allow)}</td><td>${money(x.deduct)}</td><td class="amount">${money(x.net)}</td></tr>`).join('');
printDoc('كشف الرواتب',documentHeader('كشف رواتب الموظفين','—')+
`<table><tr><th>الموظف</th><th>الشهر</th><th>الأساسي</th><th>البدلات</th><th>الخصومات</th><th>الصافي</th></tr>${rows}</table>
<div class="sign"><div>الموظف</div><div>المحاسب</div></div><div class="footer">تم إصدار كشف الرواتب بواسطة برنامج محاسبه</div>`);
}
function render(){
document.getElementById('companyName').value=db.companyName||'';
document.getElementById('homeCompanyName').textContent=db.companyName||'اسم الشركة';
cCount.textContent=db.customers.length;eCount.textContent=db.employees.length;rTotal.textContent=money(db.receipts.reduce((s,x)=>s+x.amount,0));pTotal.textContent=money(db.payments.reduce((s,x)=>s+x.amount,0));
rCustomer.innerHTML=db.customers.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
sEmp.innerHTML=db.employees.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
customersTable.innerHTML=db.customers.length?`<table><tr><th>رقم العميل</th><th>اسم العميل</th><th>رقم الهاتف</th><th>اسم المشروع</th><th>عنوان المشروع</th><th>قيمة المشروع</th></tr>${db.customers.map(x=>`<tr><td>${x.no}</td><td>${x.name}</td><td>${x.phone}</td><td>${x.project||''}</td><td>${x.address||''}</td><td>${money(x.value)}</td></tr>`).join('')}</table>`:'<div class="empty">لا يوجد عملاء</div>';
receiptsTable.innerHTML=db.receipts.length?`<table><tr><th>السند</th><th>التاريخ</th><th>العميل</th><th>المبلغ</th><th>الدفع</th></tr>${db.receipts.map(x=>`<tr><td>${x.no}</td><td>${x.date}</td><td>${x.customer}</td><td>${money(x.amount)}</td><td>${x.method}</td></tr>`).join('')}</table>`:'<div class="empty">لا توجد سندات قبض</div>';
paymentsTable.innerHTML=db.payments.length?`<table><tr><th>السند</th><th>التاريخ</th><th>المستفيد</th><th>المبلغ</th><th>الدفع</th></tr>${db.payments.map(x=>`<tr><td>${x.no}</td><td>${x.date}</td><td>${x.beneficiary}</td><td>${money(x.amount)}</td><td>${x.method}</td></tr>`).join('')}</table>`:'<div class="empty">لا توجد سندات صرف</div>';
employeesTable.innerHTML=db.employees.length?`<table><tr><th>الرقم</th><th>الموظف</th><th>الوظيفة</th><th>الراتب</th></tr>${db.employees.map(x=>`<tr><td>${x.no}</td><td>${x.name}</td><td>${x.job}</td><td>${money(x.salary)}</td></tr>`).join('')}</table>`:'<div class="empty">لا يوجد موظفون</div>';
salariesTable.innerHTML=db.salaries.length?`<table><tr><th>الموظف</th><th>الشهر</th><th>الأساسي</th><th>البدلات</th><th>الخصومات</th><th>الصافي</th></tr>${db.salaries.map(x=>`<tr><td>${x.employee}</td><td>${x.month}</td><td>${money(x.basic)}</td><td>${money(x.allow)}</td><td>${money(x.deduct)}</td><td>${money(x.net)}</td></tr>`).join('')}</table>`:'<div class="empty">لا توجد رواتب</div>';
}
document.querySelectorAll('input[type=date]').forEach(x=>x.value=new Date().toISOString().slice(0,10));render();
</script>
</body>
</html>
